{% extends "base.html" %}

{% block content %}
<h1>Review Pending Permits</h1>

{% for permit in permits %}
<p>
  Permit #{{ permit.id }} |
  Vehicle: {{ permit.vehicle_id }} |
  Lot: {{ permit.lot_id }}
</p>

<form method="post" action="{{ url_for('permits.review') }}">
  <input type="hidden" name="permit_id" value="{{ permit.id }}">
  <button type="submit" name="decision" value="approved">Approve</button>
  <button type="submit" name="decision" value="rejected">Reject</button>
</form>
{% else %}
<p>No pending permit requests.</p>
{% endfor %}
{% endblock %}
